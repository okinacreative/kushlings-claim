<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kushlings Claim – Debug</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        --green: #2ba84a;
        --green2: #33c26b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #ffffff 0%, #d8d8d8 150%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #wrap {
        width: min(720px, 96vw);
      }
      #debug {
        background: #111;
        color: #0ff;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.35;
        margin-bottom: 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #card {
        background: #fff;
        border-radius: 28px;
        width: 100%;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
        padding: 28px;
      }
      #header {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 26px;
      }
      #connectBtn,
      #rawConnectBtn {
        background: linear-gradient(90deg, var(--green) 0%, var(--green2) 100%);
        color: #fff;
        border: 3px solid #165cc9;
        border-radius: 9999px;
        height: 56px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        padding: 0 24px;
      }
      #connectBtn {
        flex: 1;
        height: 64px;
        font-size: 20px;
      }
      .label {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .input {
        width: 100%;
        background: #f3f4f6;
        border: none;
        border-radius: 16px;
        padding: 14px;
        font-size: 16px;
        outline: none;
        margin-bottom: 18px;
      }
      #claimBtn {
        width: 100%;
        background: linear-gradient(90deg, #8a77df 0%, #7ad8ed 94%);
        border: 3px solid rgba(71, 93, 191, 0.3);
        border-radius: 9999px;
        height: 62px;
        color: #fff;
        font-weight: 700;
        font-size: 20px;
        cursor: pointer;
        margin-top: 6px;
      }
      #msg {
        margin-top: 16px;
        display: none;
        font-size: 14px;
      }
      #msg.error {
        color: #c0392b;
      }
      #msg.success {
        color: #0f766e;
      }
    </style>

    <!-- ethers for later (won't block debug) -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.min.js"></script>
  </head>
  <body>
    <div id="wrap">
      <div id="debug">loading detection…</div>

      <div id="card">
        <div id="header">
          <button id="connectBtn">Connect Wallet</button>
          <button id="rawConnectBtn" type="button">Raw connect</button>
        </div>

        <div class="label">Connected:</div>
        <div id="address" style="margin-bottom: 14px">Not connected</div>

        <div class="label">Claimable (from snapshot)</div>
        <input id="claimable" class="input" value="0" readonly />

        <div class="label">Quantity to claim now</div>
        <input id="qty" class="input" value="1" />

        <button id="claimBtn">Claim Kushlings</button>
        <div id="msg"></div>
      </div>
    </div>

    <script>
      // ------- CONFIG (same as before) -------
      const CLAIMS_URL =
        "https://444669a7-f30d-433d-b040-6e30f8af2637.usrfiles.com/ugd/444669_0136e423c6d940eeaae0d6b74fcb47ab.json";
      const PROOFS_URL =
        "https://444669a7-f30d-433d-b040-6e30f8af2637.usrfiles.com/ugd/444669_1808839a4f844d90b9de50804129c0c3.json";
      const CONTRACT_ADDRESS = "0xf8E567D269B9C9be82520A6c8Cf76f364aa2735d";
      const CONTRACT_ABI = [
        {
          inputs: [
            { internalType: "uint256", name: "qty", type: "uint256" },
            { internalType: "uint256", name: "maxFor", type: "uint256" },
            { internalType: "bytes32[]", name: "proof", type: "bytes32[]" }
          ],
          name: "claim",
          outputs: [],
          stateMutability: "nonpayable",
          type: "function"
        }
      ];

      // ------- STATE -------
      let claims = {};
      let proofs = {};
      let merkleRoot = null;
      let signer = null;
      let userAddress = null;

      // ------- DOM -------
      const debugBox = document.getElementById("debug");
      const connectBtn = document.getElementById("connectBtn");
      const rawConnectBtn = document.getElementById("rawConnectBtn");
      const addressDiv = document.getElementById("address");
      const claimableInput = document.getElementById("claimable");
      const qtyInput = document.getElementById("qty");
      const claimBtn = document.getElementById("claimBtn");
      const msg = document.getElementById("msg");

      function showMessage(text, type = "error") {
        msg.textContent = text;
        msg.className = type;
        msg.style.display = "block";
      }

      function setDebug(obj) {
        debugBox.textContent = JSON.stringify(obj, null, 2);
      }

      function normalizeAddr(a) {
        return (a || "").toLowerCase();
      }

      function getAllowedFor(addr) {
        const entry = claims[addr];
        if (!entry) return 0;
        if (typeof entry === "number") return entry;
        if (typeof entry === "string" && entry.trim() !== "") return Number(entry);
        if (typeof entry === "object") {
          if (typeof entry.max === "number") return entry.max;
          if (typeof entry.claimable === "number") return entry.claimable;
          if (typeof entry.amount === "number") return entry.amount;
          const n = Object.values(entry).find((v) => typeof v === "number");
          if (n) return n;
        }
        return 0;
      }

      // ------- LOAD LISTS -------
      async function loadLists() {
        try {
          const [cRes, pRes] = await Promise.all([fetch(CLAIMS_URL), fetch(PROOFS_URL)]);
          claims = await cRes.json();
          const pJson = await pRes.json().catch(() => ({}));
          proofs = pJson.proofs || {};
          merkleRoot = pJson.root || null;
        } catch (e) {
          console.error(e);
          showMessage("Failed to load claim data.");
        }
      }

      // ------- RAW CONNECT (NO ETHERS) -------
      async function rawConnect() {
        if (!window.ethereum) {
          setDebug({
            hasEthereum: false,
            note: "No window.ethereum in this browser on this page"
          });
          showMessage("No wallet detected in this browser.");
          return;
        }
        try {
          const accounts = await window.ethereum.request({
            method: "eth_requestAccounts"
          });
          setDebug({
            hasEthereum: true,
            method: "eth_requestAccounts",
            accounts
          });
          addressDiv.textContent = accounts[0];
          showMessage("Wallet connected (raw).", "success");
        } catch (e) {
          setDebug({
            hasEthereum: true,
            method: "eth_requestAccounts",
            error: e.message || e
          });
          showMessage("Wallet connection failed.");
        }
      }

      // ------- ETHERS CONNECT (what we actually want) -------
      async function connectWallet() {
        if (!window.ethereum) {
          setDebug({
            hasEthereum: false,
            note: "No window.ethereum in this browser on this page"
          });
          showMessage("No wallet detected.");
          return;
        }
        try {
          const provider = new ethers.BrowserProvider(window.ethereum);
          signer = await provider.getSigner();
          const addr = await signer.getAddress();
          userAddress = normalizeAddr(addr);

          addressDiv.textContent = userAddress;
          connectBtn.textContent = "Connected ✅";

          const allowed = getAllowedFor(userAddress);
          claimableInput.value = String(allowed);
          setDebug({
            hasEthereum: true,
            address: userAddress,
            allowed,
            network: await provider.getNetwork().then((n) => n.name).catch(() => "unknown")
          });

          if (allowed > 0) {
            showMessage("Wallet is on the claim list.", "success");
          } else {
            showMessage("🚫 This wallet is not on the claim list.");
          }
        } catch (e) {
          console.error(e);
          setDebug({
            hasEthereum: true,
            where: "connectWallet",
            error: e.message || e
          });
          showMessage("Wallet connection failed.");
        }
      }

      // ------- CLAIM -------
      async function doClaim() {
        if (!signer || !userAddress) {
          return connectWallet();
        }
        const allowed = getAllowedFor(userAddress);
        if (!allowed) {
          return showMessage("🚫 This wallet is not on the claim list.");
        }
        const qty = Number(qtyInput.value || 0);
        if (qty < 1 || qty > allowed) {
          return showMessage("Invalid quantity.");
        }
        const proof = (proofs[userAddress] || []).map((p) => p);
        if (!proof.length) return showMessage("No Merkle proof for this wallet.");
        if (!merkleRoot) return showMessage("No Merkle root loaded.");

        try {
          const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
          claimBtn.disabled = true;
          showMessage("Sending transaction...", "success");
          const tx = await contract.claim(qty, allowed, proof);
          await tx.wait();
          showMessage("✅ Claimed!", "success");
        } catch (e) {
          console.error(e);
          showMessage("Claim failed: " + (e?.reason || e?.message || "unknown"));
        } finally {
          claimBtn.disabled = false;
        }
      }

      // ------- INIT -------
      loadLists().then(() => {
        // first debug dump
        setDebug({
          initial: true,
          hasEthereum: !!window.ethereum,
          userAgent: navigator.userAgent
        });
      });

      connectBtn.addEventListener("click", connectWallet);
      rawConnectBtn.addEventListener("click", rawConnect);
      claimBtn.addEventListener("click", doClaim);
    </script>
  </body>
</html>
