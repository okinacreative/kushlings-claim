<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kushlings Claim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --card: #ffffff;
      --bg: radial-gradient(circle at top, #ffffff 0%, #e8e8e8 150%);
      --green: #26a852;
      --green2: #3ccf74;
      --purple: #8a77df;
      --cyan: #7ad8ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #kush-card {
      background: #fff;
      border-radius: 28px;
      width: min(620px, 92vw);
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
      padding: 28px;
    }
    #kush-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 26px;
    }
    #kush-connect-btn {
      flex: 1;
      background: linear-gradient(90deg, #26a852 0%, #30b662 100%);
      color: #fff;
      border: 3px solid #165cc9;
      border-radius: 9999px;
      height: 64px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }
    #kush-wallet-btn {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #f495d1 0%, #8a77df 100%);
      border: none;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #kush-wallet-btn svg {
      width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 1.7;
    }
    .kush-label { font-weight: 600; margin-bottom: 6px; }
    .kush-input {
      width: 100%;
      background: #f3f4f6;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }
    #kush-claim-btn {
      width: 100%;
      background: linear-gradient(90deg, #8a77df 0%, #7ad8ed 94%);
      border: 3px solid rgba(71,93,191,0.3);
      border-radius: 9999px;
      height: 62px;
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      cursor: pointer;
      margin-top: 6px;
      transition: .2s;
    }
    #kush-claim-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    #kush-message {
      margin-top: 16px;
      display: none;
      font-size: 14px;
    }
    #kush-message.error { color: #c0392b; }
    #kush-message.success { color: #0f766e; }
  </style>

  <!-- ✅ ethers v5 UMD, NOT the ESM one -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"
          integrity="sha512-fTfx3g3k7Pf6YY8HuWePXycMK3c35lusz791SL53nEoaB7PPdCrJXVxPFn1u3VQLN+aszJQPplddQzoK5ri1Cw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div id="kush-card">
    <div id="kush-header">
      <button id="kush-connect-btn">Connect Wallet</button>
      <button id="kush-wallet-btn" aria-label="Wallet menu">
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/>
          <path d="M18 12h2"/>
          <path d="M8 7V5a2 2 0 0 1 2-2h6"/>
        </svg>
      </button>
    </div>

    <div class="kush-label">Connected:</div>
    <div id="kush-address" style="margin-bottom:14px;">Not connected</div>

    <div class="kush-label">Claimable (from snapshot)</div>
    <input id="kush-claimable" class="kush-input" value="0" readonly />

    <div class="kush-label">Quantity to claim now</div>
    <input id="kush-qty" class="kush-input" value="1" />

    <button id="kush-claim-btn">Claim Kushlings</button>
    <div id="kush-message"></div>
  </div>

  <script>
    // ---- config ----
    const CLAIMS_URL =
      "https://444669a7-f30d-433d-b040-6e30f8af2637.usrfiles.com/ugd/444669_0136e423c6d940eeaae0d6b74fcb47ab.json";
    const PROOFS_URL =
      "https://444669a7-f30d-433d-b040-6e30f8af2637.usrfiles.com/ugd/444669_1808839a4f844d90b9de50804129c0c3.json";

    const CONTRACT_ADDRESS = "0xf8E567D269B9C9be82520A6c8Cf76f364aa2735d";
    const CONTRACT_ABI = [
      {
        inputs: [
          { internalType: "uint256", name: "qty", type: "uint256" },
          { internalType: "uint256", name: "maxFor", type: "uint256" },
          { internalType: "bytes32[]", name: "proof", type: "bytes32[]" }
        ],
        name: "claim",
        outputs: [],
        stateMutability: "nonpayable",
        type: "function"
      }
    ];

    let claims = {};
    let proofs = {};
    let merkleRoot = null;
    let userAddress = null;
    let signer = null;

    const connectBtn  = document.getElementById("kush-connect-btn");
    const addrDiv     = document.getElementById("kush-address");
    const claimableIn = document.getElementById("kush-claimable");
    const qtyIn       = document.getElementById("kush-qty");
    const claimBtn    = document.getElementById("kush-claim-btn");
    const msg         = document.getElementById("kush-message");

    function showMessage(text, kind = "error") {
      msg.textContent = text;
      msg.className = kind === "success" ? "success" : "error";
      msg.style.display = "block";
    }

    function normalizeAddr(a) {
      return (a || "").toLowerCase();
    }

    function getAllowedFor(addr) {
      const entry = claims[addr];
      if (!entry) return 0;
      if (typeof entry === "number") return entry;
      if (typeof entry === "string" && entry.trim() !== "") return Number(entry);
      if (typeof entry === "object") {
        if (typeof entry.max === "number") return entry.max;
        if (typeof entry.claimable === "number") return entry.claimable;
        if (typeof entry.amount === "number") return entry.amount;
        const firstNum = Object.values(entry).find(v => typeof v === "number");
        if (firstNum) return firstNum;
      }
      return 0;
    }

    async function loadLists() {
      try {
        const [cRes, pRes] = await Promise.all([fetch(CLAIMS_URL), fetch(PROOFS_URL)]);
        claims = await cRes.json();
        const pJson = await pRes.json().catch(() => ({}));
        proofs = pJson.proofs || {};
        merkleRoot = pJson.root || null;
        console.log("claims loaded:", Object.keys(claims).length);
      } catch (err) {
        console.error(err);
        showMessage("Could not load claim data.");
      }
    }

    async function connectWallet() {
      try {
        if (!window.ethereum) {
          showMessage("No wallet found. Install MetaMask.");
          return;
        }

        const accounts = await window.ethereum.request({
          method: "eth_requestAccounts"
        });
        const account = accounts[0];
        userAddress = normalizeAddr(account);

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();

        addrDiv.textContent = userAddress;
        connectBtn.textContent = "Connected ✅";

        const allowed = getAllowedFor(userAddress);
        claimableIn.value = String(allowed);
        if (allowed > 0) {
          showMessage("Wallet is on the claim list.", "success");
        } else {
          showMessage("🚫 This wallet is not on the claim list.");
        }
      } catch (err) {
        console.error(err);
        showMessage("Wallet connection failed.");
      }
    }

    async function doClaim() {
      if (!signer || !userAddress) {
        return connectWallet();
      }

      const allowed = getAllowedFor(userAddress);
      if (!allowed) {
        return showMessage("🚫 This wallet is not on the claim list.");
      }

      const qty = Number(qtyIn.value || 0);
      if (qty < 1 || qty > allowed) {
        return showMessage("Invalid quantity.");
      }

      const proof = (proofs[userAddress] || []).map(p => p);
      if (!proof.length) return showMessage("No Merkle proof for this wallet. (Check proofs.json)");
      if (!merkleRoot) return showMessage("No Merkle root loaded.");

      try {
        const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
        claimBtn.disabled = true;
        showMessage("Sending transaction...", "success");
        const tx = await contract.claim(qty, allowed, proof);
        await tx.wait();
        showMessage("✅ Claimed successfully!", "success");
      } catch (err) {
        console.error(err);
        showMessage("Claim failed: " + (err?.reason || err?.message || "unknown"));
      } finally {
        claimBtn.disabled = false;
      }
    }

    connectBtn.addEventListener("click", connectWallet);
    claimBtn.addEventListener("click", doClaim);

    loadLists();
  </script>
</body>
</html>
