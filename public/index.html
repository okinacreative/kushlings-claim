<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kushlings Claim – fixed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --card: #ffffff;
      --bg: radial-gradient(circle at top, #ffffff 0%, #e8e8e8 150%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #wrap { width: min(720px, 96vw); }
    #debug {
      background: #111;
      color: #0ff;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 14px;
      max-height: 210px;
      overflow: auto;
    }
    #kush-card {
      background: #fff;
      border-radius: 28px;
      width: 100%;
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
      padding: 28px;
    }
    #kush-header {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button.main {
      flex: 1;
      height: 58px;
      border-radius: 9999px;
      border: 0;
      background: linear-gradient(90deg, #2ba84a 0%, #33c26b 100%);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    button.alt {
      height: 58px;
      border-radius: 9999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      padding: 0 18px;
      font-size: 14px;
    }
    .label { font-weight: 600; margin-bottom: 6px; }
    .input {
      width: 100%;
      background: #f3f4f6;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }
    #claimBtn {
      width: 100%;
      background: linear-gradient(90deg, #8a77df 0%, #7ad8ed 94%);
      border: 3px solid rgba(71,93,191,0.3);
      border-radius: 9999px;
      height: 62px;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      margin-top: 6px;
      transition: .2s;
    }
    #claimBtn:disabled { opacity: .6; cursor: not-allowed; }
    #msg { margin-top: 14px; display: none; }
    #msg.error { color: #c0392b; }
    #msg.success { color: #0f766e; }
  </style>

  <!-- ✅ ethers v5: browser-safe UMD -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"
    integrity="sha512-fTfx3g3k7Pf6YY8HuWePXycMK3c35lusz791SL53nEoaB7PPdCrJXVxPFn1u3VQLN+aszJQPplddQzoK5ri1Cw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
</head>
<body>
  <div id="wrap">
    <div id="debug">booting…</div>

    <div id="kush-card">
      <div id="kush-header">
        <button id="connectBtn" class="main">Connect Wallet</button>
        <button id="rawBtn" class="alt">Raw MetaMask</button>
      </div>

      <div class="label">Connected:</div>
      <div id="address" style="margin-bottom:14px;">Not connected</div>

      <div class="label">Claimable (from snapshot)</div>
      <input id="claimable" class="input" value="0" readonly />

      <div class="label">Quantity to claim now</div>
      <input id="qty" class="input" value="1" />

      <button id="claimBtn">Claim Kushlings</button>
      <div id="msg"></div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const CLAIMS_URL =
      "https://444669a7-f30d-433d-b040-6e30f8af2637.usrfiles.com/ugd/444669_0136e423c6d940eeaae0d6b74fcb47ab.json";
    const PROOFS_URL =
      "https://444669a7-f30d-433d-b040-6e30f8af2637.usrfiles.com/ugd/444669_1808839a4f844d90b9de50804129c0c3.json";
    const CONTRACT_ADDRESS = "0xf8E567D269B9C9be82520A6c8Cf76f364aa2735d";
    const CONTRACT_ABI = [
      {
        inputs: [
          { internalType: "uint256", name: "qty", type: "uint256" },
          { internalType: "uint256", name: "maxFor", type: "uint256" },
          { internalType: "bytes32[]", name: "proof", type: "bytes32[]" }
        ],
        name: "claim",
        outputs: [],
        stateMutability: "nonpayable",
        type: "function"
      }
    ];

    // ===== STATE =====
    let claims = {};
    let proofs = {};
    let merkleRoot = null;
    let signer = null;
    let userAddress = null;

    // ===== DOM =====
    const debugBox = document.getElementById("debug");
    const connectBtn = document.getElementById("connectBtn");
    const rawBtn = document.getElementById("rawBtn");
    const addrDiv = document.getElementById("address");
    const claimableIn = document.getElementById("claimable");
    const qtyIn = document.getElementById("qty");
    const claimBtn = document.getElementById("claimBtn");
    const msg = document.getElementById("msg");

    function setDebug(obj) {
      debugBox.textContent = JSON.stringify(obj, null, 2);
    }
    function showMessage(text, kind = "error") {
      msg.textContent = text;
      msg.style.display = "block";
      msg.className = kind;
    }
    function normalizeAddr(a) {
      return (a || "").toLowerCase();
    }
    function getAllowedFor(addr) {
      const entry = claims[addr];
      // show structure in debug
      setDebug({
        hasEthereum: !!window.ethereum,
        entryForWallet: entry,
        allClaimKeys: Object.keys(claims).length
      });
      if (!entry) return 0;
      if (typeof entry === "number") return entry;
      if (typeof entry === "string" && entry.trim() !== "") return Number(entry);
      if (typeof entry === "object") {
        if (typeof entry.max === "number") return entry.max;
        if (typeof entry.claimable === "number") return entry.claimable;
        if (typeof entry.amount === "number") return entry.amount;
        const n = Object.values(entry).find(v => typeof v === "number");
        if (n) return n;
      }
      return 0;
    }

    // ===== LOAD SNAPSHOTS =====
    async function loadLists() {
      try {
        const [cRes, pRes] = await Promise.all([
          fetch(CLAIMS_URL),
          fetch(PROOFS_URL)
        ]);
        claims = await cRes.json();
        const pJson = await pRes.json().catch(() => ({}));
        proofs = pJson.proofs || {};
        merkleRoot = pJson.root || null;
        setDebug({
          stage: "loaded",
          claimCount: Object.keys(claims).length,
          proofCount: Object.keys(proofs).length,
          hasRoot: !!merkleRoot,
          hasEthereum: !!window.ethereum
        });
      } catch (err) {
        console.error(err);
        setDebug({ error: "could not load JSON", detail: String(err) });
        showMessage("Could not load claim data.");
      }
    }

    // ===== RAW METAMASK (no ethers) =====
    async function rawConnect() {
      if (!window.ethereum) {
        setDebug({ hasEthereum: false, note: "No window.ethereum" });
        showMessage("No wallet found.");
        return;
      }
      try {
        const accounts = await window.ethereum.request({
          method: "eth_requestAccounts"
        });
        setDebug({ hasEthereum: true, rawAccounts: accounts });
        addrDiv.textContent = accounts[0] || "connected (no account)";
      } catch (err) {
        setDebug({ hasEthereum: true, rawError: err.message || err });
        showMessage("Raw connect failed.");
      }
    }

    // ===== ETHERS CONNECT =====
    async function connectWallet() {
      if (!window.ethereum) {
        setDebug({ hasEthereum: false });
        showMessage("No wallet found. Install MetaMask.");
        return;
      }
      try {
        // request and wrap
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        // this triggers the popup:
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        const addr = await signer.getAddress();
        userAddress = normalizeAddr(addr);

        addrDiv.textContent = userAddress;
        connectBtn.textContent = "Connected ✅";

        // look up claim
        const allowed = getAllowedFor(userAddress);
        claimableIn.value = String(allowed);

        setDebug({
          hasEthereum: true,
          connectedAddress: userAddress,
          allowed,
          network: await provider.getNetwork().then(n => n.name).catch(() => "unknown")
        });

        if (allowed > 0) {
          showMessage("Wallet is on the claim list.", "success");
        } else {
          showMessage("🚫 This wallet is not on the claim list.");
        }
      } catch (err) {
        console.error(err);
        const code = err && err.code;
        if (code === 4001) {
          showMessage("You rejected the wallet connection.");
        } else {
          showMessage("Wallet connection failed: " + (err.message || "unknown"));
        }
        setDebug({ connectError: err.message || err, code });
      }
    }

    // ===== CLAIM =====
    async function doClaim() {
      if (!signer || !userAddress) {
        return connectWallet();
      }

      const allowed = getAllowedFor(userAddress);
      if (!allowed) {
        return showMessage("🚫 This wallet is not on the claim list.");
      }

      const qty = Number(qtyIn.value || 0);
      if (qty < 1 || qty > allowed) {
        return showMessage("Invalid quantity.");
      }

      const proof = (proofs[userAddress] || []).map(p => p);
      if (!proof.length) return showMessage("No Merkle proof for this wallet. (Check proofs.json)");
      if (!merkleRoot) return showMessage("No Merkle root loaded.");

      try {
        const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
        claimBtn.disabled = true;
        showMessage("Sending transaction...", "success");
        const tx = await contract.claim(qty, allowed, proof);
        await tx.wait();
        showMessage("✅ Claimed successfully!", "success");
      } catch (err) {
        console.error(err);
        showMessage("Claim failed: " + (err?.reason || err?.message || "unknown"));
      } finally {
        claimBtn.disabled = false;
      }
    }

    // ===== LISTENERS =====
    connectBtn.addEventListener("click", connectWallet);
    rawBtn.addEventListener("click", rawConnect);
    claimBtn.addEventListener("click", doClaim);

    // listen for account changes (MetaMask best practice)
    if (typeof window !== "undefined" && window.ethereum) {
      window.ethereum.on("accountsChanged", (accounts) => {
        const acct = (accounts && accounts[0]) ? accounts[0] : null;
        userAddress = acct ? normalizeAddr(acct) : null;
        addrDiv.textContent = acct || "Not connected";
        if (acct) {
          const allowed = getAllowedFor(userAddress);
          claimableIn.value = String(allowed);
        } else {
          claimableIn.value = "0";
        }
      });
      window.ethereum.on("chainChanged", (_chainId) => {
        // simple reload is fine for our case
        window.location.reload();
      });
    }

    // ===== START =====
    document.addEventListener("DOMContentLoaded", () => {
      setDebug({
        initial: true,
        hasEthereum: !!window.ethereum,
        userAgent: navigator.userAgent
      });
      loadLists();
    });
  </script>
</body>
</html>
