<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kushlings Claim – Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <style>
    * { 
      box-sizing: border-box; 
    }
    html {
      background: #9a9a9a;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #b0afad;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #wrap { 
      width: min(720px, 96vw);
      background: transparent !important;
    }
    #kush-card {
      background: #fff;
      border-radius: 28px;
      width: 100%;
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
      padding: 28px;
    }
    #kush-header {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button.main {
      flex: 1;
      height: 54px;
      border-radius: 9999px;
      border: 0;
      background: linear-gradient(90deg, #2ba84a 0%, #33c26b 100%);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.main:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.secondary {
      height: 54px;
      border-radius: 9999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      padding: 0 18px;
      transition: opacity 0.2s;
    }
    button.secondary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #disconnectBtn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    #disconnectBtn:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }
    #disconnectBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #disconnectBtn svg {
      width: 24px;
      height: 24px;
      fill: white;
    }
    .label { font-weight: 600; margin-bottom: 6px; }
    .input {
      width: 100%;
      background: #f3f4f6;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }
    #claimBtn {
      width: 100%;
      background: linear-gradient(90deg, #8a77df 0%, #7ad8ed 94%);
      border: none;
      border-radius: 9999px;
      height: 62px;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s;
    }
    #claimBtn:disabled { opacity: .6; cursor: not-allowed; }
    #msg { margin-top: 14px; display: none; white-space: pre-line; }
    #msg.error { color: #c0392b; }
    #msg.success { color: #0f766e; }
    #msg.warning { color: #d97706; }
    #mobileWalletBtn {
      width: 100%;
      background: linear-gradient(90deg, #627EEA 0%, #3C8CF5 100%);
      border: none;
      border-radius: 9999px;
      height: 54px;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }
    #mobileInstructions {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      display: none;
    }
    #mobileInstructions h3 {
      margin: 0 0 12px 0;
      color: #856404;
      font-size: 16px;
    }
    #mobileInstructions p {
      margin: 8px 0;
      color: #856404;
      font-size: 14px;
      line-height: 1.5;
    }
    #mobileInstructions strong {
      color: #664300;
    }
    .wallet-btn {
      width: 100%;
      height: 48px;
      border-radius: 9999px;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin: 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .wallet-btn.metamask { background: linear-gradient(90deg, #627EEA 0%, #3C8CF5 100%); }
    .wallet-btn.trust { background: linear-gradient(90deg, #3375BB 0%, #4A90E2 100%); }
    .wallet-btn.coinbase { background: linear-gradient(90deg, #0052FF 0%, #2E66FF 100%); }
    .wallet-btn.rainbow { background: linear-gradient(90deg, #FF4088 0%, #8B3DFF 100%); }
    #mobileBanner {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 20px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      border-radius: 20px 20px 0 0;
      margin: -28px -28px 20px -28px;
    }
  </style>

  <!-- ethers v5 UMD (browser safe) -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"
          crossorigin="anonymous"></script>
</head>
<body>
  <div id="wrap">
    <div id="kush-card">
      <div id="mobileBanner">Kushlings Mobile Claim</div>
      <div id="kush-header">
        <button id="connectBtn" class="main">Connect Wallet</button>
        <button id="disconnectBtn" style="display:none;" title="Disconnect Wallet">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
          </svg>
        </button>
      </div>

      <div class="label">Connected:</div>
      <div id="address" style="margin-bottom:14px;">Not connected</div>

      <div class="label">Claimable (from snapshot)</div>
      <input id="claimable" class="input" value="0" readonly />

      <div class="label">Quantity to claim now</div>
      <input id="qty" class="input" value="1" />

      <button id="claimBtn">Claim Kushlings</button>
      <button id="mobileWalletBtn">🔗 Open in MetaMask Mobile</button>
      
      <div id="mobileInstructions">
        <h3>📱 Mobile Wallet Required</h3>
        <p><strong>Option 1:</strong> Tap a button below to open this page in your wallet app:</p>
        <button class="wallet-btn metamask" data-wallet="metamask">
          🦊 Open in MetaMask
        </button>
        <button class="wallet-btn trust" data-wallet="trust">
          🛡️ Open in Trust Wallet
        </button>
        <button class="wallet-btn coinbase" data-wallet="coinbase">
          🔵 Open in Coinbase Wallet
        </button>
        <button class="wallet-btn rainbow" data-wallet="rainbow">
          🌈 Open in Rainbow
        </button>
        <p style="margin-top:16px;"><strong>Option 2:</strong> Manually copy this URL and paste it into your wallet's browser</p>
      </div>
      
      <div id="msg"></div>
    </div>
  </div>

  <script>
    // Wait for both ethers.js AND window.ethereum (MetaMask Mobile can be slow)
    (function() {
      let ethersReady = typeof ethers !== 'undefined';
      let appInitialized = false;
      
      function tryInitApp() {
        if (appInitialized) return;
        if (typeof ethers === 'undefined') return;
        
        appInitialized = true;
        console.log('Initializing app...', {
          hasEthers: typeof ethers !== 'undefined',
          hasEthereum: !!window.ethereum,
          userAgent: navigator.userAgent
        });
        initApp();
      }
      
      // Check for ethers.js
      if (!ethersReady) {
        const checkEthers = setInterval(() => {
          if (typeof ethers !== 'undefined') {
            clearInterval(checkEthers);
            ethersReady = true;
            tryInitApp();
          }
        }, 100);
        setTimeout(() => clearInterval(checkEthers), 10000);
      }
      
      // MetaMask Mobile can take up to 3 seconds to inject window.ethereum
      // Wait for it before initializing
      if (ethersReady) {
        tryInitApp();
      }
      
      // Also listen for ethereum#initialized event (MetaMask Mobile)
      window.addEventListener('ethereum#initialized', () => {
        console.log('MetaMask Mobile ethereum initialized');
        tryInitApp();
      });
      
      // Fallback: try after a delay
      setTimeout(tryInitApp, 500);
      setTimeout(tryInitApp, 1000);
      setTimeout(tryInitApp, 2000);
    })();

    function initApp() {
      // --- CONFIG ---
      const CLAIMS_URL = "./claims.json";
      const PROOFS_URL = "./proofs.json";
      const CONTRACT_ADDRESS = "0xC984daA1F67da6A0deAbAA39f532B7716247f831";
      const MERKLE_ROOT = "0xd6675d0fb77769019170fc8c84f7355e92f6dd3314de6bcef0b1a026de321cf3";
      const CONTRACT_ABI = [
        {
          inputs: [
            { internalType: "uint256", name: "qty", type: "uint256" },
            { internalType: "uint256", name: "maxFor", type: "uint256" },
            { internalType: "bytes32[]", name: "proof", type: "bytes32[]" }
          ],
          name: "claim",
          outputs: [],
          stateMutability: "nonpayable",
          type: "function"
        }
      ];

      // --- STATE ---
      let claims = {};
      let proofs = {};
      let merkleRoot = null;
      let provider = null;
      let signer = null;
      let userAddress = null;
      let isConnecting = false;

      // --- DOM ---
      const connectBtn = document.getElementById("connectBtn");
      const disconnectBtn = document.getElementById("disconnectBtn");
      const mobileWalletBtn = document.getElementById("mobileWalletBtn");
      const addrDiv = document.getElementById("address");
      const claimableIn = document.getElementById("claimable");
      const qtyIn = document.getElementById("qty");
      const claimBtn = document.getElementById("claimBtn");
      const msg = document.getElementById("msg");

      function showMessage(text, kind = "error") {
        msg.textContent = text;
        msg.style.display = "block";
        msg.className = kind;
      }

      function normalizeAddr(a) {
        return (a || "").toLowerCase();
      }

      function getAllowedFor(addr) {
        const entry = claims[addr];
        if (!entry) return 0;
        if (typeof entry === "number") return entry;
        if (typeof entry === "string" && entry.trim() !== "") return Number(entry);
        if (typeof entry === "object") {
          if (typeof entry.max === "number") return entry.max;
          if (typeof entry.claimable === "number") return entry.claimable;
          if (typeof entry.amount === "number") return entry.amount;
          const n = Object.values(entry).find(v => typeof v === "number");
          if (n) return n;
        }
        return 0;
      }

      // --- LOAD SNAPSHOTS ---
      async function loadLists() {
        try {
          const [cRes, pRes] = await Promise.all([
            fetch(CLAIMS_URL),
            fetch(PROOFS_URL)
          ]);
          
          const claimsRaw = await cRes.json();
          const proofsRaw = await pRes.json().catch(() => ({}));
          
          // Normalize all addresses to lowercase
          claims = {};
          Object.keys(claimsRaw).forEach(addr => {
            claims[normalizeAddr(addr)] = claimsRaw[addr];
          });
          
          // Parse proofs - structure is {address: {qty, proof: []}}
          // CRITICAL: Store BOTH qty and proof, not just proof array
          proofs = {};
          Object.keys(proofsRaw).forEach(addr => {
            if (proofsRaw[addr] && proofsRaw[addr].proof) {
              proofs[normalizeAddr(addr)] = {
                qty: proofsRaw[addr].qty,
                proof: proofsRaw[addr].proof
              };
            }
          });
          
          // Use the configured Merkle root
          merkleRoot = MERKLE_ROOT;

          // Show sample data structure for debugging
          const sampleAddrs = Object.keys(claims).slice(0, 3);
          const sampleClaims = {};
          const sampleProofs = {};
          sampleAddrs.forEach(addr => {
            sampleClaims[addr] = claims[addr];
            if (proofs[addr]) {
              sampleProofs[addr] = { qty: proofs[addr].qty, proofLength: proofs[addr].proof.length };
            }
          });

          console.log("DEBUG:", {
            stage: "loaded snapshots",
            claimEntries: Object.keys(claims).length,
            proofEntries: Object.keys(proofs).length,
            hasProofRoot: merkleRoot !== "MERKLE_ROOT_NEEDED",
            merkleRoot: merkleRoot !== "MERKLE_ROOT_NEEDED" ? merkleRoot.substring(0, 20) + '...' : 'NOT SET',
            hasEthereum: !!window.ethereum,
            sampleClaimsData: sampleClaims,
            sampleProofsData: sampleProofs,
            ethersLoaded: typeof ethers !== 'undefined'
          });
          
          if (merkleRoot === "MERKLE_ROOT_NEEDED") {
            showMessage("⚠️ Warning: Merkle root not set. Claims will not work until configured.", "warning");
          }
        } catch (err) {
          console.error(err);
          console.log("DEBUG:", { 
            error: "could not load claim data", 
            detail: String(err),
            claimsUrl: CLAIMS_URL,
            proofsUrl: PROOFS_URL
          });
          showMessage("Could not load claim data. Check console for details.");
        }
      }

      // --- UPDATE UI WITH CONNECTED STATE ---
      function updateUIForAddress(addr) {
        userAddress = normalizeAddr(addr);
        addrDiv.textContent = userAddress;
        connectBtn.textContent = "Connected ✅";
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";

        const allowed = getAllowedFor(userAddress);
        claimableIn.value = String(allowed);

        const userProofEntry = proofs[userAddress];
        const userProof = userProofEntry ? userProofEntry.proof : [];
        const claimData = claims[userAddress];

        console.log("DEBUG:", {
          connected: true,
          address: userAddress,
          allowed,
          hasProof: userProof.length > 0,
          proofLength: userProof.length,
          proofQty: userProofEntry ? userProofEntry.qty : 0,
          claimDataType: typeof claimData,
          claimDataValue: claimData,
          network: provider ? 'checking...' : 'unknown'
        });

        if (provider) {
          provider.getNetwork().then(network => {
            console.log("DEBUG:", {
              connected: true,
              address: userAddress,
              allowed,
              hasProof: userProof.length > 0,
              proofLength: userProof.length,
              networkName: network.name,
              chainId: network.chainId
            });
          }).catch(() => {});
        }

        if (allowed > 0) {
          showMessage(`✅ Wallet is on the claim list! You can claim ${allowed} Kushlings.`, "success");
        } else {
          showMessage("🚫 This wallet is not on the claim list.", "warning");
        }
      }

      // --- HANDLE ACCOUNT CHANGES ---
      function handleAccountsChanged(accounts) {
        if (accounts.length === 0) {
          // User disconnected
          userAddress = null;
          signer = null;
          addrDiv.textContent = "Not connected";
          connectBtn.textContent = "Connect Wallet";
          connectBtn.style.display = "block";
          disconnectBtn.style.display = "none";
          claimableIn.value = "0";
          localStorage.removeItem('kushlings_wallet_connected');
          console.log("DEBUG:", {
            disconnected: true,
            hasEthereum: !!window.ethereum
          });
          showMessage("Wallet disconnected.", "warning");
        } else if (accounts[0] !== userAddress) {
          // Account changed
          localStorage.setItem('kushlings_wallet_connected', 'true');
          if (provider && signer) {
            signer.getAddress().then(addr => {
              updateUIForAddress(addr);
            }).catch(err => {
              console.error('Error getting new address:', err);
            });
          }
        }
      }

      // --- HANDLE CHAIN CHANGES ---
      function handleChainChanged(chainId) {
        console.log('Chain changed to:', chainId);
        // Reload as recommended by MetaMask
        window.location.reload();
      }

      // --- CHECK EXISTING CONNECTION ---
      async function checkExistingConnection() {
        if (!window.ethereum) return;

        try {
          const accounts = await window.ethereum.request({ 
            method: 'eth_accounts' 
          });
          
          if (accounts.length > 0 && localStorage.getItem('kushlings_wallet_connected') === 'true') {
            // Silently reconnect
            provider = new ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();
            const addr = await signer.getAddress();
            updateUIForAddress(addr);
          }
        } catch (err) {
          console.error('Error checking existing connection:', err);
        }
      }

      // --- CONNECT WALLET ---
      async function connectWallet() {
        // Check for mobile
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // Re-check for window.ethereum (MetaMask Mobile might have injected it after page load)
        const hasEthereum = !!(window.ethereum || window.web3?.currentProvider);
        
        if (!hasEthereum) {
          console.log("DEBUG:", { 
            hasEthereum: false, 
            note: "No window.ethereum detected",
            userAgent: navigator.userAgent,
            isMobile: isMobile
          });
          
          if (isMobile) {
            // Show mobile-specific instructions panel
            document.getElementById('mobileInstructions').style.display = 'block';
            showMessage("📱 No wallet detected. Please open this page in a mobile wallet browser.", "warning");
          } else {
            showMessage("No wallet found. Please install MetaMask browser extension.");
          }
          return;
        }

        if (isConnecting) {
          showMessage("Connection request already in progress...", "warning");
          return;
        }

        isConnecting = true;
        connectBtn.disabled = true;
        connectBtn.textContent = "Connecting...";

        try {
          provider = new ethers.providers.Web3Provider(window.ethereum);
          
          // Mobile wallets sometimes need a different approach
          if (isMobile) {
            // Try request directly on window.ethereum for mobile compatibility
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            if (accounts.length === 0) {
              throw new Error("No accounts returned");
            }
          } else {
            await provider.send("eth_requestAccounts", []);
          }
          
          signer = provider.getSigner();
          const addr = await signer.getAddress();
          
          localStorage.setItem('kushlings_wallet_connected', 'true');
          updateUIForAddress(addr);

        } catch (err) {
          console.error('Connection error:', err);
          
          // Handle specific error codes
          if (err.code === 4001 || err.code === -32002) {
            // User rejected or request already pending
            showMessage(err.code === 4001 
              ? "Connection request rejected. Please try again." 
              : "Connection request already pending. Please check MetaMask.", 
              "warning");
            console.log("DEBUG:", { 
              hasEthereum: true, 
              userRejected: err.code === 4001,
              requestPending: err.code === -32002,
              errorMessage: err.message 
            });
          } else {
            showMessage("Wallet connection failed: " + (err.message || "Unknown error"));
            console.log("DEBUG:", { 
              hasEthereum: true, 
              connectError: err.message || String(err),
              errorCode: err.code
            });
          }

          connectBtn.textContent = "Connect Wallet";
        } finally {
          isConnecting = false;
          connectBtn.disabled = false;
        }
      }

      // --- DISCONNECT WALLET ---
      async function disconnectWallet() {
        try {
          // Try to revoke permissions (MetaMask only)
          if (window.ethereum?.request) {
            await window.ethereum.request({
              method: 'wallet_revokePermissions',
              params: [{ eth_accounts: {} }]
            }).catch(() => {
              // If revoke fails, just clear local state
            });
          }
        } catch (err) {
          console.log('Revoke permissions not supported or failed:', err);
        }

        // Clear local state
        userAddress = null;
        signer = null;
        provider = null;
        addrDiv.textContent = "Not connected";
        connectBtn.textContent = "Connect Wallet";
        connectBtn.style.display = "block";
        disconnectBtn.style.display = "none";
        claimableIn.value = "0";
        localStorage.removeItem('kushlings_wallet_connected');
        
        console.log("DEBUG:", {
          disconnected: true,
          hasEthereum: !!window.ethereum
        });
        showMessage("Wallet disconnected.", "success");
      }

      // --- CLAIM ---
      async function doClaim() {
        if (!signer || !userAddress) {
          showMessage("Please connect your wallet first.", "warning");
          return connectWallet();
        }

        // Check network
        try {
          const network = await provider.getNetwork();
          if (network.chainId !== 1) {
            return showMessage(`❌ Wrong network! Please switch to Ethereum Mainnet (you're on chain ${network.chainId})`, "error");
          }
        } catch (err) {
          console.error('Network check error:', err);
        }

        const allowed = getAllowedFor(userAddress);
        if (!allowed) {
          return showMessage("🚫 This wallet is not on the claim list.");
        }

        const qty = Number(qtyIn.value || 0);
        if (qty < 1 || qty > allowed) {
          return showMessage(`Invalid quantity. You can claim between 1 and ${allowed}.`);
        }

        const proofEntry = proofs[userAddress];
        if (!proofEntry) {
          return showMessage("No Merkle proof found for this wallet. Check that address is in proofs.json");
        }

        const proof = proofEntry.proof;
        const maxFromLeaf = proofEntry.qty;  // CRITICAL: Use qty from proof, not from claims
        
        console.log("DEBUG CLAIM:", {
          userAddress: userAddress,
          qtyToClaim: qty,
          maxFromLeaf: maxFromLeaf,
          allowedFromClaims: allowed,
          proofLength: proof.length,
          match: maxFromLeaf === allowed ? '✅' : '⚠️ MISMATCH'
        });
        
        if (!proof.length) {
          console.log("DEBUG ERROR:", {
            error: "No Merkle proof array",
            address: userAddress,
            hasClaimEntry: !!claims[userAddress],
            hasProofEntry: !!proofs[userAddress],
            totalProofs: Object.keys(proofs).length
          });
          return showMessage("Invalid proof structure.");
        }
        if (!merkleRoot || merkleRoot === "MERKLE_ROOT_NEEDED") {
          return showMessage("❌ Merkle root not configured. Please contact the admin to set the Merkle root.");
        }

        try {
          const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
          claimBtn.disabled = true;
          showMessage(`Sending transaction to claim ${qty} Kushlings...`, "success");
          
          // CRITICAL FIX: Use maxFromLeaf (from proof) not allowed (from claims)
          const tx = await contract.claim(qty, maxFromLeaf, proof);
          showMessage(`Transaction sent! Waiting for confirmation... (tx: ${tx.hash.substring(0, 10)}...)`, "success");
          
          await tx.wait();
          showMessage(`✅ Successfully claimed ${qty} Kushlings! Transaction confirmed.`, "success");
          
          console.log("DEBUG:", {
            claimSuccess: true,
            txHash: tx.hash,
            quantity: qty,
            address: userAddress
          });
        } catch (err) {
          console.error('Claim error:', err);
          
          // Try to extract detailed error info
          let errorMsg = "execution reverted";
          let errorDetails = "";
          
          if (err?.reason) {
            errorMsg = err.reason;
          } else if (err?.error?.message) {
            errorMsg = err.error.message;
          } else if (err?.message) {
            errorMsg = err.message;
          } else if (err?.data?.message) {
            errorMsg = err.data.message;
          }
          
          // Check for specific errors
          if (errorMsg.includes('SoldOut')) {
            errorDetails = "Contract ran out of NFTs at current cursor position. Contact admin.";
          } else if (errorMsg.includes('NotAllowlisted')) {
            errorDetails = "Merkle proof verification failed. Your address may not be whitelisted.";
          } else if (errorMsg.includes('PausedErr')) {
            errorDetails = "Contract is currently paused.";
          } else if (errorMsg.includes('ExceedsAllowance')) {
            errorDetails = "You're trying to claim more than your allocation.";
          } else if (errorMsg.includes('user rejected')) {
            errorDetails = "Transaction was rejected in wallet.";
          }
          
          // Log full error for debugging
          console.error("FULL ERROR DETAILS:", {
            error: err,
            reason: err?.reason,
            message: err?.message,
            data: err?.data,
            code: err?.code,
            errorObject: JSON.stringify(err, Object.getOwnPropertyNames(err))
          });
          
          const displayMsg = errorDetails || errorMsg;
          showMessage("Claim failed: " + displayMsg);
          
          console.log("DEBUG:", {
            claimError: true,
            errorMessage: errorMsg,
            errorDetails: errorDetails,
            errorCode: err?.code,
            address: userAddress,
            contractAddress: CONTRACT_ADDRESS,
            qty: qty,
            allowed: allowed,
            proofLength: proof.length
          });
        } finally {
          claimBtn.disabled = false;
        }
      }

      // --- EVENT LISTENERS ---
      connectBtn.addEventListener("click", connectWallet);
      disconnectBtn.addEventListener("click", disconnectWallet);
      claimBtn.addEventListener("click", doClaim);
      
      // Mobile wallet button handler
      mobileWalletBtn.addEventListener("click", () => {
        const currentUrl = window.location.href;
        const metamaskUrl = `https://metamask.app.link/dapp/${currentUrl.replace(/^https?:\/\//, '')}`;
        
        showMessage("Opening MetaMask Mobile...", "success");
        
        // Open MetaMask deep link
        window.location.href = metamaskUrl;
      });
      
      // Handle all wallet button clicks
      document.querySelectorAll('.wallet-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const wallet = btn.getAttribute('data-wallet');
          const currentUrl = window.location.href.replace(/^https?:\/\//, '');
          let deepLink = '';
          
          switch(wallet) {
            case 'metamask':
              deepLink = `https://metamask.app.link/dapp/${currentUrl}`;
              showMessage("🦊 Opening MetaMask...", "success");
              break;
            case 'trust':
              deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=https://${currentUrl}`;
              showMessage("🛡️ Opening Trust Wallet...", "success");
              break;
            case 'coinbase':
              deepLink = `https://go.cb-w.com/dapp?cb_url=https://${currentUrl}`;
              showMessage("🔵 Opening Coinbase Wallet...", "success");
              break;
            case 'rainbow':
              deepLink = `https://rnbwapp.com/wc?uri=https://${currentUrl}`;
              showMessage("🌈 Opening Rainbow...", "success");
              break;
          }
          
          if (deepLink) {
            window.location.href = deepLink;
          }
        });
      });

      // Set up MetaMask event listeners
      if (window.ethereum) {
        window.ethereum.on('accountsChanged', handleAccountsChanged);
        window.ethereum.on('chainChanged', handleChainChanged);
      }

      // --- INITIALIZE ---
      console.log("DEBUG:", {
        initializing: true,
        hasEthereum: !!window.ethereum,
        ethersLoaded: typeof ethers !== 'undefined',
        userAgent: navigator.userAgent
      });

      // Load snapshot data
      loadLists();

      // Note: Not auto-connecting to avoid unwanted MetaMask popups on page load
      // Users will connect manually by clicking the "Connect Wallet" button
    }
  </script>
</body>
</html>
